# Production, on one small VPS. The same shape as the cluster file, with
# TLS in front, secrets from .env, memory limits so two JVMs and the
# databases share 4 GB politely, and nothing exposed but 80 and 443.
#
#   cp infra/.env.example infra/.env   # then edit it
#   docker compose --env-file infra/.env -f infra/docker-compose.prod.yml up -d --build
#
# Grafana is not public. Reach it over an SSH tunnel:
#   ssh -L 3000:localhost:3000 <user>@<host>   then http://localhost:3000
#
# See docs/DEPLOY.md.

name: dropline

x-app: &app
  build: ../backend
  environment: &app-env
    DB_URL: jdbc:postgresql://postgres:5432/dropline
    DB_USER: dropline
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
    REDIS_HOST: redis
    REDIS_HEALTH: "true"
    FANOUT: redis
    TOMCAT_ACCEPT_COUNT: "2048"
    OTEL_ENABLED: ${OTEL_ENABLED:-1}
    OTEL_SERVICE_NAME: dropline
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_LOGS_EXPORTER: otlp
    # The JVM sizes itself from the container limit below, not the host.
    JAVA_OPTS: -XX:MaxRAMPercentage=70
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 768m
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dropline
      POSTGRES_USER: dropline
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropline"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    restart: unless-stopped

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.instance.id=app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,service.instance.id=app2

  edge:
    build:
      context: ..
      dockerfile: infra/edge.Dockerfile
    depends_on:
      - app1
      - app2
    mem_limit: 128m
    restart: unless-stopped

  # TLS. Caddy fetches and renews the certificate for DOMAIN on its own.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - edge
    mem_limit: 128m
    restart: unless-stopped

  # Observability, optional: --profile observability. About 1.5 GB of RAM,
  # so on a 4 GB box it is a choice. Not exposed; tunnel to it.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ENABLE_LOGS_ALL: "false"
    volumes:
      - ./grafana/dropline-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dropline.yaml:ro
      - ./grafana/dropline-dashboard.json:/otel-lgtm/grafana-dashboard-dropline.json:ro
      - lgtm:/data
    mem_limit: 1536m
    restart: unless-stopped

  # A public drop sells out and stays sold out. Once a day, put it back.
  nightly-reset:
    image: postgres:16
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ../load/reset.sql:/reset.sql:ro
    command: >
      sh -c 'while true; do sleep ${RESET_EVERY_SECONDS:-86400};
             psql -h postgres -U dropline -d dropline -f /reset.sql; done'
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata:
  lgtm:
  caddy_data:
  caddy_config:
