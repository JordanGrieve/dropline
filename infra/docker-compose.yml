# Local development. Postgres and the observability backend. Redis and the
# second app instance arrive in week 4.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dropline
      POSTGRES_USER: dropline
      POSTGRES_PASSWORD: dropline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropline"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The whole observability backend in one container: OpenTelemetry
  # Collector, Tempo (traces), Prometheus (metrics), Loki (logs), Grafana.
  # For development and demos, not production. See TECH-STACK.md.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana, anonymous admin
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      ENABLE_LOGS_ALL: "false"

volumes:
  pgdata:
