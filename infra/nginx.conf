# The edge in front of two app instances. Static files for the page,
# /api and /actuator proxied, /ws upgraded and held open.
#
# No sticky sessions: the transport is WebSocket only, and every instance
# delivers every change through Redis. See TECH-STACK.md.

worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    keepalive_timeout 65;

    upstream app {
        server app1:8080 max_fails=3 fail_timeout=5s;
        server app2:8080 max_fails=3 fail_timeout=5s;
        keepalive 512;
    }

    # The demo endpoints fire a 200-buyer stampede or reset the drop. Anyone
    # may press them, nobody may hammer them: one a second per address.
    limit_req_zone $binary_remote_addr zone=demo:1m rate=1r/s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # The Linux listen backlog. Compare docs/results/NOTES.md, run 2.
        listen 80 backlog=4096;
        root /usr/share/nginx/html;

        location /api/demo/ {
            limit_req zone=demo burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Liveness only. The rest of the actuator stays inside the network.
        location = /actuator/health {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
        location /actuator/ {
            return 404;
        }

        location = /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
